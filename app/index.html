<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Experiment 9 - Docker & Jenkins CI/CD</title>
  <style>
    body {
      font-family: Arial, sans-serif;

      color: #1f2937;

      justify-content: center;

      height: 100vh;
      margin: 0;

    .card {

      border-radius: 10px;

      border-radius: 999px;
      font-size: 0.85rem;
      font-weight: bold;
    }

<body>
  <div class="card">
    <h1>Experiment 9: Deployment Successful</h1>
    <p>This containerized web application was built and deployed automatically using Jenkins and Docker.</p>
